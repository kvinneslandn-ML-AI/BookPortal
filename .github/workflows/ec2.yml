name: AWS-EC2 Instance CD

on:
  workflow_run:
    workflows: ["Node.js CI"]
    types: [completed]

jobs:
  on-success:

    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # AWS access key id
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          # AWS secret access key
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS Academy Learner Lab credentials are temporary and need the session token
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          # Where EC2 instance is
          aws-region: ${{ secrets.AWS_REGION }}

      - name: AWS SSM Send-Command
        env:
          # AWS EC2 Instance id
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
        run: |
          # docker-compose.yml lives in /home/ubuntu on the instance
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "docker-compose.yml file re-pulls newer versions of book-portal images and runs them on the instance." \
            --parameters '{"workingDirectory":["/home/ubuntu"],"commands":["sudo docker-compose stop","sudo docker-compose rm -f","sudo docker-compose pull","sudo docker-compose up -d","sudo docker image prune -af"]}' \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $COMMAND_ID"
          # Poll for up to 10 minutes until the command finishes on the instance
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
            echo "SSM command status: $STATUS"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          test "$STATUS" = "Success"
